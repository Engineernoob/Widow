services:
  # ==========================================
  # 🧠 Qdrant Vector Database
  # ==========================================
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: widow-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 🕷️ Widow Worker
  # ==========================================
  widow-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: widow-worker
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      - QDRANT_URL=http://qdrant:6334
      - RUST_LOG=info
      - WIDOW_MODE=worker
    volumes:
      - ./data/crawls:/data
    working_dir: /data
    command: ["/usr/local/bin/widow-worker"]
