services:
  # ==========================================
  # 🧠 Qdrant Vector Database
  # ==========================================
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: widow-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API
    volumes:
      - ./data/qdrant:/qdrant/storage
    # 👇 Healthcheck temporarily removed to avoid false "unhealthy" state
    # healthcheck:
    #   test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider 127.0.0.1:6333/healthz || exit 1"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 10
    #   start_period: 20s

  # ==========================================
  # 🕷️ Widow Worker
  # ==========================================
  widow-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: widow-worker
    depends_on:
      - qdrant
    environment:
      - QDRANT_URL=http://qdrant:6334
      - RUST_LOG=info
      - WIDOW_MODE=worker
    volumes:
      - ./data/crawls:/data
    working_dir: /data
    # 👇 Waits until Qdrant API responds before starting crawl
    command:
      [
        "sh",
        "-c",
        "until wget -qO- http://qdrant:6333/healthz > /dev/null; do echo '🧠 Waiting for Qdrant...'; sleep 3; done; echo '✅ Qdrant is up! Starting Widow...' && /usr/local/bin/widow-worker",
      ]
