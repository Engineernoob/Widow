services:
  # ==========================================
  # 🧠 Qdrant Vector Database
  # ==========================================
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: widow-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      # Use CMD-SHELL so curl runs properly in Debian base image
      test: ["CMD-SHELL", "curl -fs http://localhost:6333/healthz || exit 1"]
      interval: 10s # check every 10s
      timeout: 5s # fail if no response after 5s
      retries: 10 # allow 10 retries
      start_period: 15s # give Qdrant up to 15s to start

  # ==========================================
  # 🕷️ Widow Worker
  # ==========================================
  widow-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: widow-worker
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      - QDRANT_URL=http://qdrant:6334
      - RUST_LOG=info
      - WIDOW_MODE=worker
    volumes:
      - ./data/crawls:/data
    working_dir: /data
    # Add a short startup delay for stability
    command:
      [
        "sh",
        "-c",
        "echo 'Waiting for Qdrant...' && sleep 5 && /usr/local/bin/widow-worker",
      ]
